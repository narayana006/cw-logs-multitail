name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # fake credentials: the tests run against moto and never reach AWS
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run on the example files
        run: >
          cw-logs-multitail
          --from-file examples/orders-api.jsonl
          --from-file examples/orders-worker.jsonl
          --from-file examples/payments.jsonl
          --filter req-b81d04ee --fields level,msg
