[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cw-logs-multitail"
version = "0.1.0"
description = "Tail several CloudWatch Logs groups at once in one merged, colour-coded stream with filters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = ["boto3>=1.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "moto[logs]>=5"]

[project.scripts]
cw-logs-multitail = "cw_logs_multitail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
